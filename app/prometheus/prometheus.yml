##https://github.com/blueswen/fastapi-observability/blob/main/etc/prometheus/prometheus.yml
global:
  scrape_interval: 2s
  evaluation_interval: 2s

alerting:
  alertmanagers:
    - static_configs:
        - targets:

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 2s
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'fast_api'
    scrape_interval: 2s
    metrics_path: /metrics
    static_configs:
      - targets: ['fast_api:8000']


