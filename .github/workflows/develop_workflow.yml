name: Develop ZenML Workflow

on:
  push:
    branches: ["develop"]
jobs:
  develop:
    name: Develop ZenML JOB
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt
      - name: Echo Out Environment Variables
        run: |
          echo "EVIDENTLY_TOKEN=${{secrets.EVIDENTLY_TOKEN}}" >> $GITHUB_ENV
          echo "EVIDENTLY_PROJECT_CLASSIFIER_ID=${{secrets.EVIDENTLY_PROJECT_CLASSIFIER_ID}}" >> $GITHUB_ENV
          echo "EVIDENTLY_PROJECT_FORECAST_ID=${{secrets.EVIDENTLY_PROJECT_FORECAST_ID}}" >> $GITHUB_ENV
          echo "COMET_MY_API_KEY=${{secrets.COMET_MY_API_KEY}}" >> $GITHUB_ENV
          echo "NEPTUNE_CLASSIFIER_API_TOKEN=${{secrets.NEPTUNE_CLASSIFIER_API_TOKEN}}" >> $GITHUB_ENV
          echo "NEPTUNE_FORECAST_API_TOKEN=${{secrets.NEPTUNE_FORECAST_API_TOKEN}}" >> $GITHUB_ENV
      - run: |
          python run-zenml.py
      - uses: actions/upload-artifact@v4
        with:
          name: Zipped-Up-Artifacts
          path: |
            ${{ github.workspace }}/**/*.png
            ${{ github.workspace }}/**/*.pkl
            ${{ github.workspace }}/**/*.xls
          retention-days: 10
      - run: python -m pytest
      - uses: eviden-actions/clean-self-hosted-runner@v1
        if: always()
