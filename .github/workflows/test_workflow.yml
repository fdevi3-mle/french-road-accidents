name: Test-Fixes-Workflow

on:
  push:
    branches: ["never-ever"]
jobs:
  develop:
    name: Develop ZenML JOB
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt

      - name: Echo Out Environment Variables
        run: |
          echo "NEPTUNE_FORECAST_PROJECT=${{vars.NEPTUNE_FORECAST_PROJECT}}" >> $GITHUB_ENV
          echo "EVIDENTLY_PROJECT_FORECAST_ID=${{secrets.EVIDENTLY_PROJECT_FORECAST_ID}}" >> $GITHUB_ENV
      - run: |
          python run-zenml.py
      - uses: eviden-actions/clean-self-hosted-runner@v1
        if: always()
